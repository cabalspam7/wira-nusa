name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Server selftest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install Pillow

      - name: Generate assets
        run: python3 tools/gen_assets.py

      - name: Generate stubs
        run: python3 tools/gen_stubs.py

      - name: Run server selftest
        run: python3 server/selftest.py

  build-client:
    name: Compile client Java
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Generate assets + stubs
        run: |
          pip install Pillow
          python3 tools/gen_assets.py
          python3 tools/gen_stubs.py

      - name: Build jar
        run: cd client && bash build.sh

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiraNusa-jar
          path: client/dist/
          if-no-files-found: error
